[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ots-white"
version = "0.1.0"
description = "OTS W.H.I.T.E. (White Hat Infiltration Testing Engine) — local GitHub repository security auditing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ohana Tech Solutions"}]
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console"]
dependencies = []

[project.scripts]
ots-white = "ots_white.cli:main"
ots-white-gui = "ots_white.gui:main"

[tool.setuptools.packages.find]
include = ["ots_white*"]

[tool.setuptools.package-data]
ots_white = ["assets/*.png", "assets/*.ico"]
