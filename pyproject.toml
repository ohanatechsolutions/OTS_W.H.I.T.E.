[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-white"
version = "0.1.0"
description = "Privacy-first local GitHub repository secret, SAST, and offline SCA auditor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ohana Tech Solutions"}]
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console"]
dependencies = []

[project.scripts]
aegis-white = "aegis_white.cli:main"
aegis-white-gui = "aegis_white.gui:main"

[tool.setuptools.packages.find]
include = ["aegis_white*"]
