name: OTS W.H.I.T.E. — Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'ots_white/**'
      - 'desktop_launcher.py'
      - 'installer/**'
      - '!installer/*.exe'
      - '!installer/*.sha256'
      - 'tests/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/windows-installer.yml'
      - 'pyproject.toml'

# Read-only scanning; successful main builds publish signed-off source-derived installer binaries.
# The release job continues to require a version tag.
permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      # Windows cannot create a workspace whose repository name ends in a dot.
      # Clone into a safe path under RUNNER_TEMP and pin to the triggering SHA.
      - name: Checkout in Windows-safe location
        shell: pwsh
        working-directory: C:\\
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'ots-white-src'
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          try {
            git clone --no-checkout --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $dest
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated clone failed' }
            git -C $dest fetch --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Fetch triggering commit failed' }
            git -C $dest checkout --detach $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Checkout triggering commit failed' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release tag matches package and installer versions
        working-directory: ${{ runner.temp }}\\ots-white-src
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $projectVersion = ([regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version = "([^"]+)"')).Groups[1].Value
          $installerVersion = ([regex]::Match((Get-Content installer/OTS_WHITE.iss -Raw), '(?m)^#define AppVersion "([^"]+)"')).Groups[1].Value
          if (-not $projectVersion -or $tagVersion -ne $projectVersion -or $tagVersion -ne $installerVersion) {
            throw "Tag, pyproject.toml, and Inno Setup version must match"
          }
      - name: Run unit tests
        working-directory: ${{ runner.temp }}\\ots-white-src
        run: python -m unittest discover -s tests -v
      - name: Install pinned packaging tool
        working-directory: ${{ runner.temp }}\\ots-white-src
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build executable
        working-directory: ${{ runner.temp }}\\ots-white-src
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OTS_WHITE --icon "ots_white/assets/ots_white.ico" --add-data "ots_white/assets;ots_white/assets" desktop_launcher.py
      - name: Verify compiled desktop executable exists
        working-directory: ${{ runner.temp }}\\ots-white-src
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/OTS_WHITE.exe')) { throw 'Compiled OTS_WHITE.exe was not created' }
      - name: Build Inno Setup installer
        working-directory: ${{ runner.temp }}\\ots-white-src
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 missing on runner' }
          & $iscc 'installer\OTS_WHITE.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Generate SHA-256 manifest
        working-directory: ${{ runner.temp }}\\ots-white-src
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\output\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer output not found' }
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *$($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "Created installer and matching SHA-256 manifest"
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v7
        with:
          name: OTS_WHITE-Windows-Installer
          path: |
            ${{ runner.temp }}\\ots-white-src\\installer\\output\\*.exe
            ${{ runner.temp }}\\ots-white-src\\installer\\output\\*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit fresh renamed installer to repository
        working-directory: ${{ runner.temp }}\\ots-white-src
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exes = @(Get-ChildItem 'installer/output/OTS_WHITE_Setup_*.exe' -File)
          if ($exes.Count -ne 1) { throw 'Expected exactly one OTS W.H.I.T.E. installer' }
          $exe = $exes[0]
          $checksum = "$($exe.FullName).sha256"
          if (!(Test-Path $checksum)) { throw 'Matching checksum not found' }
          Copy-Item $exe.FullName (Join-Path 'installer' $exe.Name) -Force
          Copy-Item $checksum (Join-Path 'installer' ($exe.Name + '.sha256')) -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "installer/$($exe.Name)" "installer/$($exe.Name).sha256"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Installer files are unchanged.'
            exit 0
          }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          try {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main head' }
            $remoteHead = (git rev-parse FETCH_HEAD).Trim()
            if ($remoteHead -ne $env:GITHUB_SHA) {
              Write-Warning 'Newer source reached main during this build; leaving this validated installer in the Actions artifacts.'
              exit 0
            }
            git commit -m "build: refresh OTS W.H.I.T.E. Windows installer [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Installer commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Concurrent update to main prevented installer push; the validated installer remains available as an Actions artifact.'
              exit 0
            }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packaging output
        uses: actions/download-artifact@v8
        with:
          name: OTS_WHITE-Windows-Installer
          path: ${{ runner.temp }}\\ots-white-release-assets
      - name: Publish tagged GitHub Release
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ots-white-release-assets') -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw 'Expected installer and matching SHA-256 file' }
          gh release create $env:GITHUB_REF_NAME $files --repo $env:GITHUB_REPOSITORY --title "OTS W.H.I.T.E. $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
