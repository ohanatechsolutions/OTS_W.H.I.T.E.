name: OTS W.H.I.T.E. — Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'ots_white/**'
      - 'desktop_launcher.py'
      - 'installer/**'
      - '!installer/*.exe'
      - '!installer/*.sha256'
      - 'tests/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/windows-installer.yml'
      - 'pyproject.toml'

# Read-only scanning; successful main builds publish signed-off source-derived installer binaries.
# The release job continues to require a version tag.
permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release tag matches package and installer versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $projectVersion = ([regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version = "([^"]+)"')).Groups[1].Value
          $installerVersion = ([regex]::Match((Get-Content installer/OTS_WHITE.iss -Raw), '(?m)^#define AppVersion "([^"]+)"')).Groups[1].Value
          if (-not $projectVersion -or $tagVersion -ne $projectVersion -or $tagVersion -ne $installerVersion) {
            throw "Tag, pyproject.toml, and Inno Setup version must match"
          }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OTS_WHITE desktop_launcher.py
      - name: Verify compiled desktop executable exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/OTS_WHITE.exe')) { throw 'Compiled OTS_WHITE.exe was not created' }
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 missing on runner' }
          & $iscc 'installer\OTS_WHITE.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\output\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer output not found' }
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *$($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "Created installer and matching SHA-256 manifest"
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: OTS_WHITE-Windows-Installer
          path: |
            installer/output/*.exe
            installer/output/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit fresh renamed installer to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem 'installer/output/OTS_WHITE_Setup_*.exe' -File)
          if ($exes.Count -ne 1) { throw 'Expected exactly one OTS W.H.I.T.E. installer' }
          $exe = $exes[0]
          $checksum = "$($exe.FullName).sha256"
          if (!(Test-Path $checksum)) { throw 'Matching checksum not found' }
          Copy-Item $exe.FullName (Join-Path 'installer' $exe.Name) -Force
          Copy-Item $checksum (Join-Path 'installer' ($exe.Name + '.sha256')) -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "installer/$($exe.Name)" "installer/$($exe.Name).sha256"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: refresh OTS W.H.I.T.E. Windows installer [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Installer commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Installer push failed' }
          }

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packaging output
        uses: actions/download-artifact@v4
        with:
          name: OTS_WHITE-Windows-Installer
          path: release-assets
      - name: Publish tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem 'release-assets' -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw 'Expected installer and matching SHA-256 file' }
          gh release create $env:GITHUB_REF_NAME $files --repo $env:GITHUB_REPOSITORY --title "OTS W.H.I.T.E. $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
