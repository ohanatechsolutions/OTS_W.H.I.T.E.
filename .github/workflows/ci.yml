name: Aegis White CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Privacy-first static and secret audit (no outbound APIs)
        run: python -m aegis_white . --no-sca --history --fail-on high --format table --exclude 'installer/*.exe'
# SCA must be run separately with OSV-Scanner v2 and a pre-populated local DB.
# No package installation/build is performed on the scanned repository.
