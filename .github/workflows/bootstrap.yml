name: Initial source import and Windows build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract source
        shell: bash
        run: |
          printf '%s  %s\n' '871247889918f8746320657192a2b177c795b42ec9b20f2ea8adce9a19447f0d' 'bootstrap/aegis_white_source.tar.bz2' | sha256sum --check --status
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive=Path("bootstrap/aegis_white_source.tar.bz2")
          with tarfile.open(archive, "r:bz2") as tf:
              items=tf.getmembers()
              for m in items:
                  p=Path(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts or m.issym() or m.islnk():
                      raise SystemExit("Unexpected archive entry")
              tf.extractall(".", filter="data")
          print("Imported",len(items),"verified source files")
          PY
          rm -f bootstrap/aegis_white_source.tar.bz2 .github/workflows/bootstrap.yml
          rmdir bootstrap
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Built-in security audit
        run: python -m aegis_white . --no-sca --history --fail-on high
      - name: Publish audited source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Aegis White v0.1.0 source and workflows"
          git push origin HEAD:main
  windows-installer:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AegisWhite desktop_launcher.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
          & $iscc 'installer\AegisWhite.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler failed' }
      - name: Write SHA-256 file
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\output\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer missing' }
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *$($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AegisWhite-Windows-Installer
          path: |
            installer/output/*.exe
            installer/output/*.sha256
          if-no-files-found: error
          retention-days: 30
